<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 600px;
      padding: 40px;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #161b22;
    }
    h1 { font-size: 2.5rem; margin-bottom: 12px; }
    p  { color: #8b949e; font-size: 1.1rem; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #238636;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    a:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 It's Live!</h1>
    <p>Your GitHub Pages site is working correctly.</p>
    <a href="https://github.com" target="_blank">Visit GitHub</a>
  </div>
</body>
</html>
